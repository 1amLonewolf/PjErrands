<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me?</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      background-size: 400% 400%;
      animation: gradientBG 8s ease infinite;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .floating-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      font-size: 24px;
      opacity: 0.3;
      animation: floatUp 6s ease-in-out infinite;
    }

    @keyframes floatUp {
      0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }

    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
      z-index: 1;
      backdrop-filter: blur(10px);
      animation: fadeInScale 0.8s ease;
    }

    @keyframes fadeInScale {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 2.5rem;
      color: #ff6b9d;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.2);
    }

    .question-mark {
      display: inline-block;
      animation: bounce 1s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 30px;
      position: relative;
    }

    .btn {
      padding: 15px 50px;
      font-size: 1.3rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      z-index: 10;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff6b9d, #ff8fab);
      color: white;
      box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
    }

    .btn-yes:hover {
      transform: scale(1.1) rotate(-2deg);
      box-shadow: 0 12px 35px rgba(255, 107, 157, 0.5);
    }

    .btn-yes:active {
      transform: scale(0.95);
    }

    .btn-no {
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
      color: white;
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
    }

    .btn-no:hover {
      transform: scale(1.1) rotate(2deg);
    }

    .btn-no.fleeing {
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .sad-emoji {
      font-size: 2rem;
      position: absolute;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 5;
    }

    .sad-emoji.show {
      opacity: 1;
      animation: sadBounce 0.5s ease;
    }

    @keyframes sadBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .success-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .success-overlay.show {
      display: flex;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .hug-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: hugPulse 1s ease-in-out infinite;
    }

    @keyframes hugPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .hug-emoji {
      font-size: 8rem;
      position: relative;
    }

    .hug-arms {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .hug-arm {
      position: absolute;
      width: 60px;
      height: 80px;
      background: linear-gradient(135deg, #ff6b9d, #ff8fab);
      border-radius: 30px;
      top: 50%;
      transform: translateY(-50%);
      animation: armMove 1s ease-in-out infinite;
    }

    .hug-arm.left {
      left: 10px;
      transform: translateY(-50%) rotate(20deg);
      transform-origin: right center;
    }

    .hug-arm.right {
      right: 10px;
      transform: translateY(-50%) rotate(-20deg);
      transform-origin: left center;
    }

    @keyframes armMove {
      0%, 100% { transform: translateY(-50%) rotate(20deg); }
      50% { transform: translateY(-50%) rotate(0deg); }
    }

    .success-message {
      font-size: 2.5rem;
      color: #ff6b9d;
      margin-top: 20px;
      animation: messagePop 0.5s ease;
    }

    @keyframes messagePop {
      0% { transform: scale(0); }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .hearts-row {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      font-size: 2rem;
    }

    .heart-beat {
      animation: heartBeat 0.8s ease-in-out infinite;
    }

    .heart-beat:nth-child(2) { animation-delay: 0.2s; }
    .heart-beat:nth-child(3) { animation-delay: 0.4s; }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    .confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.8rem; }
      
      .btn {
        padding: 12px 35px;
        font-size: 1.1rem;
      }
      
      .container {
        padding: 30px 20px;
        margin: 20px;
      }
      
      .buttons {
        flex-direction: column;
        gap: 15px;
      }

      .btn-yes {
        order: 1;
      }

      .btn-no {
        order: 2;
      }
    }
  </style>
</head>
<body>
  <div class="floating-hearts" id="floatingHearts"></div>

  <div class="container">
    <h1>Do you love me?<span class="question-mark">?</span></h1>
    <div class="buttons">
      <button class="btn btn-yes" id="btnYes">YES</button>
      <button class="btn btn-no" id="btnNo">NO</button>
      <span class="sad-emoji" id="sadEmoji">😢</span>
    </div>
  </div>

  <div class="success-overlay" id="successOverlay">
    <canvas class="confetti-canvas" id="confettiCanvas"></canvas>
    <div class="hug-container">
      <div class="hug-arm left"></div>
      <div class="hug-arm right"></div>
      <span class="hug-emoji">🤗</span>
    </div>
    <p class="success-message">I love you too! 💕</p>
    <div class="hearts-row">
      <span class="heart-beat">❤️</span>
      <span class="heart-beat">💖</span>
      <span class="heart-beat">💕</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    const btnNo = document.getElementById('btnNo');
    const btnYes = document.getElementById('btnYes');
    const sadEmoji = document.getElementById('sadEmoji');
    const successOverlay = document.getElementById('successOverlay');
    const confettiCanvas = document.getElementById('confettiCanvas');
    const floatingHearts = document.getElementById('floatingHearts');

    const isLargeScreen = window.innerWidth > 768;

    function createFloatingHearts() {
      const hearts = ['💕', '💖', '💗', '❤️', '💘'];
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDelay = Math.random() * 6 + 's';
        heart.style.animationDuration = (5 + Math.random() * 4) + 's';
        floatingHearts.appendChild(heart);
      }
    }
    createFloatingHearts();

    function getRandomPosition() {
      const container = document.querySelector('.container');
      const containerRect = container.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();
      
      const maxX = window.innerWidth - btnRect.width - 40;
      const maxY = window.innerHeight - btnRect.height - 40;
      
      let newX, newY;
      let attempts = 0;
      
      do {
        newX = Math.random() * maxX;
        newY = Math.random() * maxY;
        attempts++;
      } while (
        newX > containerRect.left - 50 && 
        newX < containerRect.right + 50 &&
        newY > containerRect.top - 50 && 
        newY < containerRect.bottom + 50 &&
        attempts < 10
      );
      
      return { x: newX, y: newY };
    }

    function moveNoButton() {
      const pos = getRandomPosition();
      btnNo.style.position = 'fixed';
      btnNo.style.left = pos.x + 'px';
      btnNo.style.top = pos.y + 'px';
      btnNo.style.zIndex = '1000';
      btnNo.classList.add('fleeing');
      
      sadEmoji.style.left = (pos.x + 80) + 'px';
      sadEmoji.style.top = pos.y + 'px';
      sadEmoji.classList.add('show');
      
      setTimeout(() => {
        sadEmoji.classList.remove('show');
      }, 1500);
    }

    if (isLargeScreen) {
      let mouseX = 0;
      let mouseY = 0;
      let hoverTimeout;

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      btnNo.addEventListener('mouseenter', () => {
        clearTimeout(hoverTimeout);
        hoverTimeout = setTimeout(() => {
          const btnRect = btnNo.getBoundingClientRect();
          const dist = Math.sqrt(
            Math.pow(mouseX - (btnRect.left + btnRect.width / 2), 2) +
            Math.pow(mouseY - (btnRect.top + btnRect.height / 2), 2)
          );
          
          if (dist < 150) {
            moveNoButton();
          }
        }, 50);
      });
    } else {
      btnNo.addEventListener('click', moveNoButton);
      btnNo.addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveNoButton();
      });
    }

    btnYes.addEventListener('click', () => {
      successOverlay.classList.add('show');
      triggerConfetti();
    });

    function triggerConfetti() {
      const duration = 3000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#ff6b9d', '#ff8fab', '#ffb6c1', '#ff69b4', '#ff1493']
        });
        
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#ff6b9d', '#ff8fab', '#ffb6c1', '#ff69b4', '#ff1493']
        });

        confetti({
          particleCount: 3,
          spread: 70,
          origin: { x: Math.random(), y: Math.random() * 0.3 },
          shapes: ['heart'],
          colors: ['#ff6b9d', '#ff1493', '#ff69b4']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }

    window.addEventListener('resize', () => {
      if (window.innerWidth > 768 && !isLargeScreen) {
        location.reload();
      }
    });
  </script>
</body>
</html>
